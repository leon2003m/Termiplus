// Under Sysbox: start the Docker daemon right after apt installed Docker, so
// "apt-get install docker.io" is all a user (or model) has to do.
DPkg::Post-Invoke { "if grep -q sysboxfs /proc/self/mountinfo 2>/dev/null && command -v dockerd >/dev/null 2>&1; then /usr/local/bin/start-docker >/dev/null 2>&1 || echo 'start-docker failed, see /var/log/dockerd.log' >&2; fi"; };
