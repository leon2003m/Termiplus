<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>termiplus workspaces</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header><h1>termiplus</h1><span id="roles"></span></header>
<main>
  <p id="status" role="status"></p>
  <section id="workspaces-section" hidden>
    <h2>Start a workspace</h2>
    <ul id="workspaces"></ul>
  </section>
  <section id="sessions-section" hidden>
    <h2>Your sessions</h2>
    <ul id="sessions"></ul>
  </section>
</main>
</body>
</html>
