version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci" }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /image]
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore" }

  - package-ecosystem: gomod
    directory: /
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore" }
