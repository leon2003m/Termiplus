name: Release

on:
  push:
    # v1.2.3 is a release, v1.2.3-rc.4 a pre-release (not tagged "latest").
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Signing and GitHub attestations write to public transparency logs and are
  # only available for public repositories on GitHub's free plan. They switch
  # on automatically when the repository is public.
  PUBLIC_REPO: ${{ !github.event.repository.private }}
  PRERELEASE: ${{ contains(github.ref_name, '-') }}

jobs:
  verify:
    name: verify tag is on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main"; exit 1
          fi

  # Nothing is pushed, signed or published before the maintainer approves the
  # run in the protected "release" environment (required reviewer, v* tags
  # only). Every publishing job depends on this one.
  approve:
    name: maintainer approval
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    steps:
      - run: echo "Release $GITHUB_REF_NAME approved by $GITHUB_TRIGGERING_ACTOR."

  images:
    name: image (${{ matrix.image }})
    needs: approve
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless signing (public repos)
      attestations: write  # build provenance (public repos)
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: gateway, context: ., target: gateway }
          - { image: sockproxy, context: ., target: sockproxy }
          - { image: mcp, context: ., target: mcp }
          - { image: terminal, context: image, target: "" }
          - { image: dns-forwarder, context: deploy/dns-forwarder, target: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/termiplus-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - run: .github/scripts/install-tools.sh trivy
      - name: Scan pushed image and write SBOM
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/termiplus-${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format table --output "trivy-${{ matrix.image }}.txt" "$IMAGE"
          trivy image --quiet --format spdx-json --output "sbom-${{ matrix.image }}.spdx.json" "$IMAGE"
          echo "${{ matrix.image }} ${IMAGE}" > "digest-${{ matrix.image }}.txt"
          { echo "## termiplus-${{ matrix.image }}"; echo "\`$IMAGE\`"; echo '```'; cat "trivy-${{ matrix.image }}.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build provenance attestation
        if: env.PUBLIC_REPO == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/termiplus-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLIC_REPO == 'true'
      - name: Sign image (keyless)
        if: env.PUBLIC_REPO == 'true'
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ github.repository_owner }}/termiplus-${{ matrix.image }}@${{ steps.build.outputs.digest }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.image }}
          path: |
            trivy-${{ matrix.image }}.txt
            sbom-${{ matrix.image }}.spdx.json
            digest-${{ matrix.image }}.txt
          retention-days: 90

  # The desktop image extends the terminal image, so it is built on the
  # terminal image just pushed, pinned by digest.
  desktop:
    name: image (desktop)
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-terminal
          path: base
      - id: base
        run: |
          ref=$(cut -d' ' -f2 base/digest-terminal.txt)
          case "$ref" in
            ghcr.io/*@sha256:*) echo "ref=$ref" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected terminal image reference: $ref"; exit 1 ;;
          esac
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/termiplus-desktop
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image/desktop
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE=${{ steps.base.outputs.ref }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - run: .github/scripts/install-tools.sh trivy
      - name: Scan pushed image and write SBOM
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/termiplus-desktop@${{ steps.build.outputs.digest }}
        run: |
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format table --output "trivy-desktop.txt" "$IMAGE"
          trivy image --quiet --format spdx-json --output "sbom-desktop.spdx.json" "$IMAGE"
          echo "desktop ${IMAGE}" > "digest-desktop.txt"
          { echo "## termiplus-desktop"; echo "\`$IMAGE\`"; echo '```'; cat "trivy-desktop.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build provenance attestation
        if: env.PUBLIC_REPO == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/termiplus-desktop
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLIC_REPO == 'true'
      - name: Sign image (keyless)
        if: env.PUBLIC_REPO == 'true'
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ github.repository_owner }}/termiplus-desktop@${{ steps.build.outputs.digest }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop
          path: |
            trivy-desktop.txt
            sbom-desktop.spdx.json
            digest-desktop.txt
          retention-days: 90

  github-release:
    name: GitHub release
    needs: [images, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No section [$v] in CHANGELOG.md, using [Unreleased]"
            awk '/^## \[Unreleased\]/ {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          fi
          {
            echo
            echo "## Images"
            echo
            echo '```'
            cat dist/digest-*.txt
            echo '```'
            echo
            echo "SBOMs (SPDX) and vulnerability reports are attached. Verify an image with"
            echo "\`cosign verify --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>@<digest>\`"
            echo "and \`gh attestation verify oci://<image>@<digest> --repo ${GITHUB_REPOSITORY}\`."
          } >> notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=()
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${pre[@]}" dist/*
