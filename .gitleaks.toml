title = "termiplus gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Obviously fake values used in tests and docs"
# Match the regexes against the whole line, not only the extracted value.
regexTarget = "line"
paths = [
  '''internal/.*_test\.go''',
  '''integrations/openwebui/test_.*\.py''',
  '''test/integration/oidc/(realm\.json|run\.sh|desktop\.sh)''',
]
regexes = [
  '''owui-to-gateway-key-0123456789abcdef''',
  '''per-container-key-secret-0123456789ab''',
  # RFC 6455 section 1.3 sample Sec-WebSocket-Key, not a secret
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  # Keycloak's database URL (host, port, database name; no credentials)
  '''jdbc:postgresql://keycloak-db:5432/keycloak''',
]
