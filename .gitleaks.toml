title = "termiplus gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Obviously fake values used in tests and docs"
paths = [
  '''internal/.*_test\.go''',
  '''integrations/openwebui/test_.*\.py''',
  '''test/integration/oidc/(realm\.json|run\.sh)''',
]
regexes = [
  '''owui-to-gateway-key-0123456789abcdef''',
  '''per-container-key-secret-0123456789ab''',
]
