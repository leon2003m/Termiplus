# Opt-in overlay: the termiplus MCP control plane (docs/mcp.md, alpha).
#
#   docker compose -f docker-compose.yml -f docker-compose.mcp.yml up -d
#
# Without this overlay the gateway's /control/v1 API stays off (404).
#
# Prerequisites:
#   - deploy/secrets/control_api_key: >=32 chars, distinct from gateway_api_key
#     and admin_api_key:   openssl rand -hex 32 > deploy/secrets/control_api_key
#   - deploy/secrets/mcp_dev_token: the bearer token MCP callers present.
#     DEV ONLY: caller auth is a static token until OIDC/JWKS lands; every
#     caller using it acts as MCP_DEV_USER.
#
# The MCP server sits on its own network with the gateway (ot-mcp) and on the
# Open WebUI network so the OWUI plugin can reach it. It never touches the
# Docker socket or holds the proxy token. For the separate-VM layout (which
# drops the owui network) publish the port instead, e.g. ports: ["127.0.0.1:8090:8090"].
name: termiplus

services:
  mcp:
    image: ghcr.io/leon2003m/termiplus-mcp:${TERMIPLUS_VERSION:-latest}
    build: { context: .., target: mcp }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    user: "65534:65534"
    depends_on:
      gateway: { condition: service_healthy }
    environment:
      GATEWAY_URL: http://gateway:8080
      GATEWAY_PUBLIC_URL: ${MCP_GATEWAY_PUBLIC_URL:-http://gateway:8080}
      CONTROL_API_KEY_FILE: /run/secrets/control_api_key
      MCP_DEV_TOKEN_FILE: /run/secrets/mcp_dev_token
      MCP_DEV_USER: ${MCP_DEV_USER:-dev}
      MCP_DEV_ROLES: ${MCP_DEV_ROLES:-}
    secrets: [control_api_key, mcp_dev_token]
    networks: [ot-mcp, owui]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  gateway:
    environment:
      CONTROL_API_KEY_FILE: /run/secrets/control_api_key
    secrets: [control_api_key]
    networks:
      ot-mcp: {}

networks:
  ot-mcp:
    internal: true

secrets:
  control_api_key: { file: ./secrets/control_api_key }
  mcp_dev_token: { file: ./secrets/mcp_dev_token }
