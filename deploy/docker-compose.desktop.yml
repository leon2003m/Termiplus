# Optional human console and expiring, image-only screen shares.
# Interactive desktop, browser and app previews use the native Open WebUI
# terminal connection (Open WebUI >=0.13, Open Terminal 0.16).
# DESKTOP_PUBLIC_URL is the console origin; DESKTOP_STREAM_URL is the separate
# share origin (legacy setting name). No VNC or app-forwarding port is exposed.
# Use with docker-compose.yml and docker-compose.mcp.yml.
# Desktop policies need the image/desktop image and "desktop": true.
# Configure the termiplus-desktop OIDC client with both URLs /oauth2/callback.
name: termiplus

services:
  desk-auth:
    # oauth2-proxy v7.15.5 (same image as mcp-auth)
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    user: "65532:65532"
    depends_on:
      gateway: { condition: service_healthy }
    command:
      - --provider=oidc
      - --oidc-issuer-url=${MCP_OIDC_ISSUER_URL:?set MCP_OIDC_ISSUER_URL}
      - --client-id=${DESKTOP_OIDC_CLIENT_ID:-termiplus-desktop}
      - --client-secret-file=/run/secrets/desk_oidc_client_secret
      - --cookie-secret-file=/run/secrets/desk_oidc_cookie_secret
      - --redirect-url=${DESKTOP_PUBLIC_URL:?set DESKTOP_PUBLIC_URL}/oauth2/callback
      - --code-challenge-method=S256
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-name=_termiplus_desk
      - --email-domain=*
      - --skip-provider-button=true
      # Behind the TLS reverse proxy; trust its X-Forwarded-* headers.
      - --reverse-proxy=true
      - --oidc-groups-claim=${MCP_OIDC_GROUPS_CLAIM:-groups}
      # Only the console; desktops are on their own origin (desk-stream-auth).
      - --upstream=http://mcp:8091/ui/
      # No token or credential of ours is handed on.
      - --pass-basic-auth=false
      - --pass-access-token=false
      - --pass-authorization-header=false
      - --set-xauthrequest=false
      - --http-address=0.0.0.0:4180
      - --silence-ping-logging
    secrets: [desk_oidc_client_secret, desk_oidc_cookie_secret]
    ports:
      - "127.0.0.1:${DESKTOP_PORT:-4181}:4180"
    networks: [ot-mcp-ui, owui]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  desk-stream-auth:
    # oauth2-proxy v7.15.5, as desk-auth but for the screen shares
    # on their own origin with their own cookie.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    user: "65532:65532"
    depends_on:
      gateway: { condition: service_healthy }
    command:
      - --provider=oidc
      - --oidc-issuer-url=${MCP_OIDC_ISSUER_URL:?set MCP_OIDC_ISSUER_URL}
      - --client-id=${DESKTOP_OIDC_CLIENT_ID:-termiplus-desktop}
      - --client-secret-file=/run/secrets/desk_oidc_client_secret
      - --cookie-secret-file=/run/secrets/dstream_oidc_cookie_secret
      - --redirect-url=${DESKTOP_STREAM_URL:?set DESKTOP_STREAM_URL (shares, an origin of their own)}/oauth2/callback
      - --code-challenge-method=S256
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-name=_termiplus_dstream
      - --email-domain=*
      - --skip-provider-button=true
      # Behind the TLS reverse proxy; trust its X-Forwarded-* headers.
      - --reverse-proxy=true
      - --oidc-groups-claim=${MCP_OIDC_GROUPS_CLAIM:-groups}
      # Only the screen shares; never the console.
      - --upstream=http://mcp:8093/share/
      # No token or credential of ours is handed on.
      - --pass-basic-auth=false
      - --pass-access-token=false
      - --pass-authorization-header=false
      - --set-xauthrequest=false
      - --http-address=0.0.0.0:4180
      - --silence-ping-logging
    secrets: [desk_oidc_client_secret, dstream_oidc_cookie_secret]
    ports:
      - "127.0.0.1:${DESKTOP_STREAM_PORT:-4183}:4180"
    networks: [ot-mcp-stream, owui]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  mcp:
    environment:
      # Console and screen shares: two origins.
      CONSOLE_PUBLIC_URL: ${DESKTOP_PUBLIC_URL:?set DESKTOP_PUBLIC_URL}
      STREAM_PUBLIC_URL: ${DESKTOP_STREAM_URL:?set DESKTOP_STREAM_URL}
      # Screen shares; trusts desk-stream-auth's identity headers.
      STREAM_LISTEN_ADDR: ":8093"
      # Console; trusts desk-auth's identity headers. Besides
      # desk-auth (ot-mcp-ui) only mcp-auth and the gateway share a network
      # with the MCP server, and neither forwards browser requests to this
      # port.
      UI_LISTEN_ADDR: ":8091"
    networks:
      ot-mcp-ui: {}
      ot-mcp-stream: {}

networks:
  # desk-auth <-> mcp console only. desk-auth also joins owui to reach the
  # issuer.
  ot-mcp-ui:
    internal: true
  # desk-stream-auth <-> mcp screen shares only.
  ot-mcp-stream:
    internal: true

secrets:
  desk_oidc_client_secret: { file: "${TERMIPLUS_SECRETS_DIR:-./secrets}/desk_oidc_client_secret" }
  desk_oidc_cookie_secret: { file: "${TERMIPLUS_SECRETS_DIR:-./secrets}/desk_oidc_cookie_secret" }
  dstream_oidc_cookie_secret: { file: "${TERMIPLUS_SECRETS_DIR:-./secrets}/dstream_oidc_cookie_secret" }
