# Hand same-bridge (container<->container) traffic to ip(6)tables so the
# terminal-isolation DROP rules in deploy/firewall.sh apply to it. firewall.sh
# also sets and verifies these at apply time; this file makes them survive a
# reboot so there is no window after boot where bridged traffic bypasses the
# rules. Install to /etc/sysctl.d/90-termiplus-bridge.conf (requires the
# br_netfilter module; load it via /etc/modules-load.d, e.g. "br_netfilter").
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1
