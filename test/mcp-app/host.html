<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MCP App host harness</title></head>
<body>
<!-- Mirrors the host side of Open WebUI's MCP App bridge (JSON-RPC 2.0 over
     postMessage). No approval gate: this validates the panel/server contract. -->
<iframe id="panel" src="/panel.html" sandbox="allow-scripts" style="width:720px;height:700px;border:1px solid #888"></iframe>
<script>
"use strict";
window.__mcpCalls = [];
var frame = document.getElementById("panel");
var rpcId = 1;

function toPanel(msg) { frame.contentWindow.postMessage(msg, "*"); }

async function mcp(method, params) {
  window.__mcpCalls.push({ method: method, name: params && params.name });
  var r = await fetch("/mcp", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: rpcId++, method: method, params: params }) });
  return r.json();
}

window.addEventListener("message", async function (e) {
  if (e.source !== frame.contentWindow) return;
  var m = e.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.method === "ui/initialize" && m.id != null) {
    toPanel({ jsonrpc: "2.0", id: m.id, result: { protocolVersion: "2026-01-26", hostInfo: { name: "harness", version: "1" },
      hostCapabilities: {}, hostContext: { theme: "light" } } });
  } else if (m.method === "ui/notifications/initialized") {
    var j = await mcp("tools/call", { name: "open_workspaces", arguments: {} });
    toPanel({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: j.result });
  } else if (m.method === "tools/call" && m.id != null) {
    var out = await mcp("tools/call", m.params);
    toPanel(out.error ? { jsonrpc: "2.0", id: m.id, error: out.error } : { jsonrpc: "2.0", id: m.id, result: out.result });
  } else if (m.method === "ui/open-link" && m.id != null) {
    toPanel({ jsonrpc: "2.0", id: m.id, result: {} });
  } else if (m.method === "ui/notifications/size-changed") {
    /* ignored */
  } else if (m.id != null && m.method) {
    toPanel({ jsonrpc: "2.0", id: m.id, error: { code: -32601, message: "unsupported" } });
  }
});
</script>
</body></html>
